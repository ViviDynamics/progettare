  <title>Progettare, a hand setting a drafting compass</title>
  <desc>An ivory hand holds a brass compass. Its drawing point meets an arc centered on the needle point, on a forest-green rounded square.</desc>
  <rect width="1254" height="1254" rx="274" fill="#214E3D"/>
