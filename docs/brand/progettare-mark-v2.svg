  <path d="M776 955 A396 396 0 0 1 729.647 1140.911" stroke="#F6F3EB" stroke-width="18" stroke-linecap="round"/>
  <!-- Equal-length, continuous legs joined behind the hinge. -->
  <path d="M553 626 L585 643 L395 936 L380 955 L382 929 Z M603 626 L571 643 L761 936 L776 955 L774 929 Z" fill="#BC9654"/>
  <!-- The handle extends beneath both fingertips to give an actual pinch grip. -->
  <rect x="548" y="498" width="62" height="90" rx="12" fill="#BC9654"/>
  <circle cx="578" cy="610" r="44" fill="#BC9654"/>
  <circle cx="578" cy="610" r="29" fill="#214E3D"/>
  <circle cx="578" cy="610" r="20" fill="#BC9654"/>
