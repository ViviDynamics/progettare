[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "progettare"
version = "0.1.0"
description = "A technical-planning meta harness: bounded survey, one blueprint, ceremony decided by code."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Elastic-License-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.scripts]
progettare = "progettare.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/progettare"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
