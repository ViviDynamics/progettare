name: Release

# Tags a release only after CI passes on main, so an unvalidated commit is never
# released. workflow_run also fires for fork PRs, which is why the job below
# accepts nothing but a successful push to this repository's main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Tag CalVer release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Derived from existing tags rather than a committed file, as in elm and
      # conductor: nothing on a branch can go stale or need bumping. Only this
      # scheme's unprefixed CalVer tags are reused, so a rerun is idempotent
      # and a foreign v-prefixed tag can never collide with a derived one.
      - name: Derive CalVer version from existing tags
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git tag --points-at HEAD | grep -E '^[0-9]{4}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)"
          if [ -n "$existing" ]; then
            echo "Reusing existing tag on HEAD: $existing"
            version="$existing"
          else
            version="$(python3 .github/scripts/next_calver.py)"
            echo "Derived new version: $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Tagged locally first: hatch-vcs reads `git describe`, so the wheel can
      # only carry the release version if the tag exists before the build.
      - name: Tag locally, then build the wheel and the sdist
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.derive.outputs.version }}'
          git tag --force "$version"
          uv build
          ls "dist/progettare-${version}-py3-none-any.whl" "dist/progettare-${version}.tar.gz"

      # The nare pin is resolved at MINT time and persisted as a release
      # asset, so a later rerun of the image job installs the nare the
      # release was minted against, even if nare has published since.
      - name: Resolve the nare pin for this release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/ViviDynamics/nare/releases/latest --jq .tag_name > dist/nare.version

      - name: Create GitHub release and tag
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.derive.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const version = process.env.VERSION;
            const sha = process.env.SHA;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version,
              });
              console.log(`Release ${version} already exists, skipping`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            // The assets go on in the SAME call that creates the release.
            // This repository's releases are immutable, so `gh release upload`
            // afterwards fails with HTTP 422 and a release ships bare.
            const { execFileSync } = require('node:child_process');
            // Only the artifacts, plus the nare pin the image job reads
            // back. `uv build` leaves a .gitignore in dist/, and 2026.9.7
            // shipped it as an asset called default.gitignore.
            const files = require('node:fs')
              .readdirSync('dist')
              .filter((name) => name.endsWith('.whl') || name.endsWith('.tar.gz') || name === 'nare.version')
              .map((name) => `dist/${name}`);
            if (files.length !== 3) {
              throw new Error(`expected a wheel, an sdist, and nare.version in dist/, found ${files.join(', ') || 'nothing'}`);
            }
            execFileSync('gh', [
              'release', 'create', version,
              '--target', sha,
              '--title', version,
              '--notes', commit.data.commit.message,
              ...files,
            ], { stdio: 'inherit', env: { ...process.env, GH_TOKEN: process.env.GITHUB_TOKEN } });
            console.log(`Created release ${version} with ${files.length} asset(s)`);

  image:
    name: Publish the container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The TAG, not the branch head: what ships must be the commit that was
      # validated and released, even if main has moved since.
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # hatch-vcs reads the tag, so the wheel's metadata is the release version
      # by construction rather than by a value somebody remembered to bump.
      - name: Build the wheel and the sdist
        run: uv build

      - name: Check the built version is the released one
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          ls "dist/progettare-${version}-py3-none-any.whl" "dist/progettare-${version}.tar.gz"

      - name: Set up QEMU for the arm64 half
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/progettare"
          # nare is pinned at mint time, persisted on the release itself as
          # an asset, so every rebuild of this version's image installs the
          # same nare even if nare has published since.
          asset_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$version" --jq '.assets[] | select(.name == "nare.version") | .url')"
          nare_version="$(gh api --header 'Accept: application/octet-stream' "$asset_url")"
          echo "nare pin for $version: $nare_version"
          # `latest` tracks the repository's newest release, resolved fresh
          # at publication: rerunning an older release republishes its own
          # version tag without rolling the newer image back, while a rerun
          # that failed before publishing can still recover `latest`.
          latest="$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)"
          if [ "$latest" = "$version" ]; then
            tags=(-t "${image}:${version}" -t "${image}:latest")
          else
            tags=(-t "${image}:${version}")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "WHEEL=dist/progettare-${version}-py3-none-any.whl" \
            --build-arg "NARE_VERSION=${nare_version}" \
            "${tags[@]}" \
            --push .

      - name: Check the image reports the released version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/progettare"
          # Pulls the manifest and runs the image's own architecture.
          printed="$(docker run --rm "${image}:${version}" --version)"
          if [ "$printed" != "$version" ]; then
            echo "image reports ${printed}, release is ${version}" >&2
            exit 1
          fi
